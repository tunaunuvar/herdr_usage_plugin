id = "tunaunuvar.herdr-usage-limits"
name = "AI Usage Limits"
version = "0.7.2"
min_herdr_version = "0.9.0"
description = "Quota panel for Codex, Claude, OMP, OpenRouter and detected AI CLI tools"
platforms = ["windows", "macos", "linux"]

[[panes]]
id = "usage"
title = "AI Usage Limits"
placement = "popup"
width = "90%"
height = "80%"
command = ["node", "usage.js"]

[[actions]]
id = "open"
title = "Open AI usage limits"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "tunaunuvar.herdr-usage-limits", "--entrypoint", "usage", "--placement", "popup", "--width", "90%", "--height", "80%"]
